<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiRoute Sales Rep Portal</title>
    <style>
        html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; display: block; }
        body { overflow: hidden; }
    </style>
</head>
<body>
    <iframe id="portal" title="OptiRoute Sales Rep Portal"></iframe>
    <script>
        const userId = localStorage.getItem('optiroute_user');
        const users = JSON.parse(localStorage.getItem('optiroute_users') || '[]');
        if (!users.some(user => user.id === userId && user.role === 'rep')) {
            window.location.replace('login.html');
        } else {
            document.getElementById('portal').src = './index.html?role=rep';
        }
    </script>
</body>
</html>
